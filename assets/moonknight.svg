  <!-- Glowing Eyes -->
  <ellipse cx="81" cy="60" rx="3.5" ry="1.8" fill="#ffffff" transform="rotate(-5 81 60)"/>
  <ellipse cx="93" cy="60" rx="3.5" ry="1.8" fill="#ffffff" transform="rotate(5 93 60)"/>
  <circle cx="81" cy="60" r="4" fill="#aee2ff" opacity="0.6"/>
  <circle cx="93" cy="60" r="4" fill="#aee2ff" opacity="0.6"/>
